<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DigiSphere Dashboard</title>

    <link rel="stylesheet"
        href="dashboard.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!--=========================
        HEADER
    ==========================-->

    <header class="topbar">

        <button
            id="menuBtn"
            class="icon-btn">

            <i class="fa-solid fa-bars"></i>

        </button>

        <div class="top-actions">

            <button
                id="walletBtn"
                class="wallet-pill">

                <i class="fa-solid fa-wallet"></i>

                <span id="headerWallet">

                    ₦0.00

                </span>

            </button>

            <button
                id="themeBtn"
                class="icon-btn">

                <i class="fa-regular fa-moon"></i>

            </button>

            <button
                id="notificationBtn"
                class="icon-btn notification-btn">

                <i class="fa-regular fa-bell"></i>

                <span
                    id="notificationBadge">

                    0

                </span>

            </button>

            <button
                id="profileBtn"
                class="profile-btn">

                <span
                    id="profileLetter">

                    D

                </span>

            </button>

        </div>

    </header>

    <!--=========================
        NOTIFICATION DROPDOWN
    ==========================-->

    <div
        id="notificationDropdown"
        class="notification-dropdown">

    </div>

    <!--=========================
        SIDEBAR
    ==========================-->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay">

    </div>

    <aside
        id="sidebar"
        class="sidebar">

    </aside>

    <!--=========================
        MAIN CONTENT
    ==========================-->

    <main
        class="dashboard-content">

    </main>

</div>

<script
type="module"
src="dashboard.js">

</script>

</body>

</html>
