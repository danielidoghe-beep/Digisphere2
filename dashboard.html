<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DigiSphere Dashboard</title>

    <link rel="stylesheet"
        href="dashboard.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!--=========================
        HEADER
    ==========================-->

    <header class="topbar">

        <button
            id="menuBtn"
            class="icon-btn">

            <i class="fa-solid fa-bars"></i>

        </button>

        <div class="top-actions">

            <button
                id="walletBtn"
                class="wallet-pill">

                <i class="fa-solid fa-wallet"></i>

                <span id="headerWallet">

                    ₦0.00

                </span>

            </button>

            <button
                id="themeBtn"
                class="icon-btn">

                <i class="fa-regular fa-moon"></i>

            </button>

            <button
                id="notificationBtn"
                class="icon-btn notification-btn">

                <i class="fa-regular fa-bell"></i>

                <span
                    id="notificationBadge">

                    0

                </span>

            </button>

            <button
                id="profileBtn"
                class="profile-btn">

                <span
                    id="profileLetter">

                    D

                </span>

            </button>

        </div>

    </header>

    <!--=========================
        NOTIFICATION DROPDOWN
    ==========================-->

    <!--==================================
NOTIFICATION DROPDOWN
===================================-->

<div id="notificationDropdown" class="notification-dropdown">

    <div class="notification-header">

        <h2>

            Notifications

        </h2>

        <button id="markAllRead">

            Mark all read

        </button>

    </div>

    <div id="notificationList" class="notification-list">

        <!-- Firebase Notifications -->

    </div>

    <button id="viewAllNotifications"

        class="view-all-btn">

        View all notifications

    </button>

</div>

    <!--=========================
        SIDEBAR
    ==========================-->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay">

    </div>

    <aside id="sidebar" class="sidebar">

    <!-- Header -->

    <div class="sidebar-header">

        <div class="sidebar-user">

            <div class="sidebar-avatar">

                <span id="sidebarProfileLetter">D</span>

            </div>

            <div class="sidebar-user-info">

                <h3 id="sidebarUserName"></h3>

                <p id="sidebarUserEmail"></p>

            </div>

        </div>

        <button id="closeSidebar" class="close-btn">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <!-- MAIN -->

    <div class="sidebar-section">

        <p class="sidebar-title">

            MAIN

        </p>

        <a href="dashboard.html" class="sidebar-link active">

            <i class="fa-solid fa-house"></i>

            <span>Dashboard</span>

        </a>

        <a href="wallet.html" class="sidebar-link">

            <i class="fa-solid fa-wallet"></i>

            <span>Wallet</span>

        </a>

        <a href="orders.html" class="sidebar-link">

            <i class="fa-solid fa-box"></i>

            <span>Orders</span>

        </a>

        <a href="transactions.html" class="sidebar-link">

            <i class="fa-solid fa-arrow-right-arrow-left"></i>

            <span>Transactions</span>

        </a>

        <!-- Only visible for admin -->

        <a href="admin.html"

            class="sidebar-link"

            id="adminPanelItem"

            style="display:none;">

            <i class="fa-solid fa-user-shield"></i>

            <span>Admin Panel</span>

        </a>

    </div>

    <!-- STORE -->

    <div class="sidebar-section">

        <p class="sidebar-title">

            STORE

        </p>

        <a href="logs.html" class="sidebar-link">

            <i class="fa-solid fa-user-lock"></i>

            <span>Logs Store</span>

        </a>

        <a href="tools.html" class="sidebar-link">

            <i class="fa-solid fa-screwdriver-wrench"></i>

            <span>Tools Store</span>

        </a>

        <a href="#" id="smsNumbersBtn" class="sidebar-link">

            <i class="fa-solid fa-comment-dots"></i>

            <span>SMS Numbers</span>

        </a>

        <a href="#" id="smeBtn" class="sidebar-link">

            <i class="fa-solid fa-bullhorn"></i>

            <span>SME Boosting</span>

        </a>

        <a href="#" id="esimBtn" class="sidebar-link">

            <i class="fa-solid fa-sim-card"></i>

            <span>E-SIM</span>

        </a>

        <a href="#" id="communityBtn" class="sidebar-link">

            <i class="fa-brands fa-whatsapp"></i>

            <span>Community</span>

        </a>

    </div>

    <!-- ACCOUNT -->

    <div class="sidebar-section">

        <p class="sidebar-title">

            ACCOUNT

        </p>

        <a href="support.html" class="sidebar-link">

            <i class="fa-regular fa-life-ring"></i>

            <span>Support</span>

        </a>

        <a href="profile.html" class="sidebar-link">

            <i class="fa-regular fa-user"></i>

            <span>Profile</span>

        </a>

        <button id="logoutBtn" class="logout-btn">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Sign Out</span>

        </button>

    </div>

</aside>

    <!--=========================
        MAIN CONTENT
    ==========================-->

    <main
        class="dashboard-content">

    </main>

</div>

<script
type="module"
src="dashboard.js">

</script>

</body>

</html>
