<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - Digisphere</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h2>Digisphere</h2>

    </div>

    <div class="header-icons">

        <div class="moon">☾</div>

        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</header>

<section class="signin-page">

    <div class="signin-container">

        <h1>Sign in</h1>

        <p class="signin-subtitle">
            Welcome back to Digisphere
        </p>

        <a href="#" class="google-btn">

            <img
    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
    class="google-icon"
    alt="Google">

            <span>Sign in with Google</span>

        </a>

        <div class="divider">

            <span></span>

            <p>or sign in with email</p>

            <span></span>

        </div>

        <form id="loginForm">
          <div id="message"></div>
            <label>Email</label>

            <input
    type="email"
    id="email"
    placeholder="you@example.com"
    required
>

            <label>Password</label>

            <div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

              <button type="button" class="eye-btn">

<svg width="24" height="24" viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>

<circle cx="12" cy="12" r="3"/>

</svg>

</button>

            </div>

            <div class="signin-options">

                <label class="remember">

                    <input type="checkbox">

                    <span>Remember me</span>

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>

            <button
    type="submit"
    id="loginBtn"
    class="signin-btn">
    Sign in
</button>

        <form id="loginForm">

        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">

                Sign up

            </a>

        </div>

    </div>

</section>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnpsEIlXwPLSCJAGMS7feM2JMhmxzCCfs",
  authDomain: "digisphere-66fdf.firebaseapp.com",
  projectId: "digisphere-66fdf",
  storageBucket: "digisphere-66fdf.firebasestorage.app",
  messagingSenderId: "834194884246",
  appId: "1:834194884246:web:72672ca253c3d7dd9d24b7",
  measurementId: "G-19QS4036V7"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    loginBtn.textContent = "Signing in...";
    loginBtn.disabled = true;

    message.style.display = "none";

    try {

        await signInWithEmailAndPassword(
            auth,
            email.value,
            password.value
        );

        message.className = "success-message";
        message.textContent = "Login successful! Redirecting...";
        message.style.display = "block";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 2000);

    } catch (error) {

        message.className = "error-message";
        message.textContent = "Invalid email or password.";

        message.style.display = "block";

        loginBtn.textContent = "Sign in";
        loginBtn.disabled = false;
    }
});
</script>
</body>
</html>
